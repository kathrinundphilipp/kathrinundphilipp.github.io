/* ---------- Grundwerte ---------- */
:root {
  color-scheme: light only;
  --cream: #f7ede4;
  --ivory: #fbf6ef;
  /* Palette: #74896F · #7D9883 · #576D53 · #567258 · #465C47 */
  --ink: #2b382c;          /* Fließtext: sehr dunkles Grün */
  --ink-soft: #4a5a4b;
  --wax: #465c47;          /* Überschriften, Labels, Rahmen der Buttons */
  --btn: #576d53;          /* gefüllte Buttons */
  --sage: #465c47;         /* Hintergrund Desktop/Querformat */
  --line: #7d9883;         /* Linien in Formular, FAQ, Countdown, Zeitleiste */
  --mid: #74896f;
  --gold: #b39a62;
  --gold-soft: rgba(179, 154, 98, .55);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --dur: 1000ms;
  --col: 100%;
  --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --serif: var(--sans);
  --script: "Eyesome", "Script", "Snell Roundhand", cursive;
  --track: .26em;
  --gap: clamp(96px, 22vw, 168px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --paper: url("assets/papier.png");
}
@media (min-width: 400px) { :root { --track: .32em; } }
/* Desktop und Querformat: zentrierte Spalte auf Salbeigrün wie beim Save the Date */
@media (min-aspect-ratio: 4/5) and (min-width: 600px) {
  :root { --col: clamp(420px, 50vw, 760px); }
}

*, *::before, *::after { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  background: var(--sage);
  scroll-behavior: smooth;
}
html.intro { overflow: hidden; }
body {
  margin: 0; min-height: 100%;
  background: var(--sage);
  color: var(--ink);
  font: 400 clamp(17px, 4.5vw, 18px)/1.75 var(--sans);
  font-variant-numeric: lining-nums proportional-nums;
  font-kerning: normal;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
::selection { background: var(--wax); color: var(--cream); }
img, video { display: block; max-width: 100%; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--wax); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#stage {
  position: fixed; top: 0; bottom: 0; left: 50%;

  transform: translateX(-50%);

  background: #c4b8a8;
  transition: opacity 2.2s ease-in-out;
  border: 0; padding: 0; margin: 0;
  display: block; cursor: pointer;
}

}
#stage.out { opacity: 0; pointer-events: none; }

/* Handschriftlicher Name auf dem Umschlag */
#ink {
  z-index: 3; pointer-events: none;
  mix-blend-mode: multiply;
  -webkit-mask-image: radial-gradient(circle at var(--sx, -999px) var(--sy, -999px), transparent var(--sr, 0px), #000 calc(var(--sr, 0px) + var(--sf, 1px)));
          mask-image: radial-gradient(circle at var(--sx, -999px) var(--sy, -999px), transparent var(--sr, 0px), #000 calc(var(--sr, 0px) + var(--sf, 1px)));
}
#ink .name {
  display: block; position: absolute; left: 50%; top: 62%;
  width: var(--nw, 80%);
  transform: translate(-50%, -50%) perspective(900px) rotateX(9deg) rotate(-2.2deg);
  margin: 0; text-align: center;
  font: 400 var(--nf, 40px)/1.12 var(--script);
  color: #262520;
  text-wrap: balance;
  hyphens: manual;
  opacity: 0;
  filter: blur(.6px);
  transition: opacity 1600ms var(--ease), filter 1600ms var(--ease);
}
#ink .name.on { opacity: .9; filter: blur(.15px); }
#ink.fading .name { transition: none; }

.hint {
  position: absolute; left: 50%; z-index: 4;
  bottom: calc(5.5% + var(--safe-b));
  transform: translateX(-50%);
  margin: 0; white-space: nowrap;
  color: #fff;
  font: 500 13px/1 var(--sans);
  font-size: clamp(12.5px, 3.5vw, 14px);
  letter-spacing: .35em; margin-right: -.35em;
  text-transform: uppercase;
  text-shadow: 0 1px 8px rgba(0,0,0,.55);
  animation: pulse 2.4s ease-in-out infinite;
  transition: opacity .6s var(--ease);
  pointer-events: none;
}
@media (max-height: 500px) { .hint { bottom: calc(3% + var(--safe-b)); } .loader { bottom: calc(3% + var(--safe-b) + 7px); } }
@keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
#stage.started .hint { animation: none; opacity: 0; }
.loader {
  position: absolute; left: 50%; z-index: 4;
  bottom: calc(5.5% + var(--safe-b) + 7px);
  width: 120px; height: 1px; margin-left: -60px;
  background: rgba(255,255,255,.25); overflow: hidden;
  opacity: 0; transition: opacity .8s var(--ease);
}
.loader::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  animation: sweep 1.8s var(--ease) infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
#stage.waiting .loader { opacity: 1; }

/* ---------- Einladung ---------- */
main {
  position: relative; container-type: inline-size;
  width: min(100%, var(--col));
  margin: 0 auto;
  background: var(--paper) 0 0 / 128px 128px, var(--cream);
  padding-left: var(--safe-l); padding-right: var(--safe-r);
  overflow: hidden;
}
@media (min-aspect-ratio: 4/5) and (min-width: 600px) {
  main { box-shadow: 0 0 80px rgba(0,0,0,.35); }
}
/* Während des Intros wird die Einladung weder gelayoutet noch gezeichnet */
html.intro main { visibility: hidden; content-visibility: hidden; }

.wrap { width: min(100% - 48px, 34em); margin-inline: auto; text-align: center; }
.sec { padding-block: calc(var(--gap) / 2); }

.label {
  font: 500 clamp(11.5px, 3.1vw, 12.5px)/1.6 var(--sans);
  font: 500 clamp(11.5px, 3.1cqi, 12.5px)/1.6 var(--sans);
  letter-spacing: var(--track); margin: 0 calc(var(--track) * -1) 0 0;
  text-transform: uppercase; color: var(--wax);
  font-variant-numeric: lining-nums;
}
h2 {
  font: 300 clamp(25px, 6.9vw, 34px)/1.25 var(--sans);
  font: 300 clamp(25px, 6.9cqi, 34px)/1.25 var(--sans);
  letter-spacing: .01em; margin: .7em 0 0; color: var(--wax);
  text-wrap: balance; hyphens: manual;
}
h3 {
  font: 500 clamp(11.5px, 3.1vw, 12.5px)/1.6 var(--sans);
  font: 500 clamp(11.5px, 3.1cqi, 12.5px)/1.6 var(--sans);
  letter-spacing: var(--track); margin: 0 calc(var(--track) * -1) .9em 0;
  text-transform: uppercase; color: var(--wax);
}
p { margin: 0 0 1em; hyphens: auto; text-wrap: pretty; }
.lead { margin-top: 1.6em; }
.lead p:last-child { margin-bottom: 0; }
.rule { width: 56px; height: 1px; background: var(--gold); margin: 1.8em auto; border: 0; }
.script { font-family: var(--script); font-weight: 400; letter-spacing: 0; line-height: 1; }

/* sichtbare Platzhalter für fehlende Inhalte */
.ph {
  background: rgba(196, 98, 45, .12); color: #7a3412;
  border-bottom: 1px dashed rgba(122, 52, 18, .6);
  padding: 0 .15em; font-style: normal; font-family: var(--sans); font-weight: 400;
  letter-spacing: 0; text-transform: none; border-radius: 0;
}
.label .ph, h3 .ph, .btn .ph { font-size: 1.2em; }

/* Trenner mit Monogramm */
.divider { display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--gold); }
.divider::before, .divider::after { content: ""; height: 1px; width: 64px; background: var(--gold-soft); }
.mono { font: 300 14px/1 var(--sans); letter-spacing: .28em; margin-right: -.28em; }
.mono-ring {
  display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto;
  border-radius: 50%; border: 1px solid var(--gold); color: var(--gold);
  box-shadow: 0 0 0 4px var(--cream), 0 0 0 5px var(--gold-soft);
  font: 300 17px/1 var(--sans); letter-spacing: .18em; text-indent: .18em;
}

/* Hero als gedruckte Karte */
.hero {
  min-height: 100vh; min-height: 100svh;
  padding: calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b));
  display: flex;
}
.card {
  position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  border: 1px solid var(--gold);
  padding: 72px 20px 88px;
}
.card::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--gold-soft); pointer-events: none; }
.hero .label { font-size: clamp(12px, 3.4vw, 14px); }
.hero .label { font-size: clamp(12px, 3.4cqi, 14px); }
.hero-date {
  /* passt immer einzeilig in die Karte: Eyesome ist ca. 7,7 em breit */
  font-size: clamp(30px, calc((100vw - 72px) / 7.9), 80px);
  font-size: clamp(30px, calc((100cqi - 72px) / 7.9), 80px);
  margin: .3em 0 .95em; color: var(--ink);
  max-width: 100%; white-space: nowrap; line-height: 1.2;
}
.hero-names { font-size: clamp(13px, 3.9vw, 16px) !important; }
.hero-names { font-size: clamp(13px, 3.9cqi, 16px) !important; }
.hero-place { margin-top: 2.4em; font-weight: 400; font-size: clamp(14px, 3.9vw, 16px); letter-spacing: .06em; color: var(--ink-soft); }
.hero-place { font-size: clamp(14px, 3.9cqi, 16px); }
.hero .mono-ring { margin-bottom: 2.4em; }
.scroll-cue {
  position: absolute; left: 50%; bottom: 28px; width: 1px; height: 44px;
  background: linear-gradient(var(--gold), transparent); transform-origin: top;
  animation: cue 2.8s var(--ease) infinite;
}
@keyframes cue { 0% { transform: scaleY(0); opacity: 0; } 30% { opacity: 1; } 70% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

/* Begrüßung */

.greet-name { font-size: clamp(38px, 11cqi, 56px); }

.count { display: flex; justify-content: center; margin: 2.2em 0 .6em; }
.count > div { flex: 1 1 0; max-width: 8.4rem; padding: 0 .4rem; }
.count > div + div { border-left: 1px solid var(--line); }
.count .num {
  display: block; font: 200 clamp(34px, 10vw, 50px)/1 var(--sans);
  display: block; font: 200 clamp(34px, 10cqi, 50px)/1 var(--sans);
  font-variant-numeric: lining-nums tabular-nums; color: var(--wax);
}
.count .unit { display: block; margin-top: .9em; }
.count-done { font: 400 clamp(36px, 10vw, 50px)/1.2 var(--script); margin: 1.2em 0 .4em; }
.weekday { font: 300 clamp(17px, 4.6vw, 20px)/1.4 var(--sans); letter-spacing: .04em; margin: .5em 0 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .6em;
  min-height: 52px; min-width: 44px; padding: 14px 26px;
  border: 1px solid var(--wax); border-radius: 1px;
  background: linear-gradient(var(--btn), var(--btn)) no-repeat left / 0% 100%;
  color: var(--wax); text-decoration: none;
  font: 500 clamp(11.5px, 3.1vw, 12.5px)/1.3 var(--sans);
  font: 500 clamp(11.5px, 3.1cqi, 12.5px)/1.3 var(--sans);
  letter-spacing: var(--track); text-transform: uppercase;
  transition: background-size 700ms var(--ease), color 700ms var(--ease);
  -webkit-appearance: none; appearance: none;
}
.btn > span { margin-right: calc(var(--track) * -1); }
.btn:active { background-size: 100% 100%; color: var(--cream); transition-duration: 200ms; }

  let plural = true;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const form = s => String(s).replace(/\{([^|{}]*)\|([^|{}]*)\}/g, (_, a, b) => plural ? b : a);
  const inline = s => esc(form(s)).replace(/\[([^\]]+)\]/g, '<mark class="ph">[$1]</mark>').replace(/\n/g, "<br>");
  // Kein einzelnes Wort allein in der letzten Zeile; „Ja-Wort“ nie am Bindestrich trennen
  const tidy = p => p.replace(/Ja-Wort/g, "Ja-⁠Wort").replace(/ (\S+)$/, " $1");
  const paras = s => String(s).trim() ? String(s).trim().split(/\n\s*\n/).map(p => `<p>${inline(tidy(p))}</p>`).join("") : "";

    ink.style.setProperty("--sx", x * k + "px");
    ink.style.setProperty("--sy", y * k + "px");
    ink.style.setProperty("--sr", 206 * k + "px");
    ink.style.setProperty("--sf", 26 * k + "px");
    const o = t < FADE_FROM ? 1 : t > FADE_TO ? 0 : 1 - (t - FADE_FROM) / (FADE_TO - FADE_FROM);
    ink.style.opacity = o;
  }

  let loopId = 0;
  function inkLoop() {
    if (video.requestVideoFrameCallback) {
      const cb = (_, meta) => { syncInk(meta.mediaTime); if (!video.ended) loopId = video.requestVideoFrameCallback(cb); };
      loopId = video.requestVideoFrameCallback(cb);
    } else {
      const step = () => { syncInk(video.currentTime); if (!video.ended) loopId = requestAnimationFrame(step); };
      loopId = requestAnimationFrame(step);
    }
  }

  /* ---------- Intro-Ablauf ---------- */
  let started = false, finished = false, waitTimer = 0, safety = 0;

  function reveal() {
    plate.classList.add("playing");
    stage.classList.remove("waiting");
    clearTimeout(waitTimer);
  }

  function start() {
    if (started) return;
    started = true;
    stage.classList.add("started");
    ink.classList.add("fading");
    waitTimer = setTimeout(() => stage.classList.add("waiting"), 400);
    syncInk(0);

    video.addEventListener("ended", finish, { once: true });
    video.addEventListener("timeupdate", () => { if (video.duration && video.currentTime >= video.duration - 0.06) finish(); });
    video.addEventListener("error", finish, { once: true });
    safety = setTimeout(finish, 20000);

    // Genug geladen? Dann sofort. Sonst bleibt das Standbild (mit feiner Ladelinie)
    // stehen, bis das Video ohne Ruckeln durchlaufen kann – höchstens 10 s.
    if (video.readyState >= 4) return play();
    let go = false;
    const ready = () => { if (!go) { go = true; video.removeEventListener("canplaythrough", ready); play(); } };
    video.addEventListener("canplaythrough", ready);
    setTimeout(ready, 10000);
    // play() im Tipp-Ereignis gibt das Video frei (iOS) und startet das Laden
    const p = video.play();
    if (p && p.then) p.then(() => { if (!go) video.pause(); }).catch(() => {});
    else video.pause();
  }

  function play() {
    video.pause();
    video.currentTime = 0;
    inkLoop();
    let shown = false;
    const firstFrame = () => {
      if (shown) return;
      shown = true;
      reveal();
      clearTimeout(safety);
      safety = setTimeout(finish, Math.max(6000, (video.duration || 5) * 1000 + 2500));
    };
    video.addEventListener("playing", () => {
      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(firstFrame);
      else {
        const check = () => video.currentTime > 0.04 ? firstFrame() : requestAnimationFrame(check);
        check();
      }
    }, { once: true });
    const p = video.play();
    if (p && p.catch) p.catch(() => finish());
  }

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(safety); clearTimeout(waitTimer);
    window.scrollTo(0, 0);
    if (!rendered) render();
    root.classList.remove("intro");
    $("#main").removeAttribute("aria-hidden");
    stage.classList.add("out");
    stage.setAttribute("aria-hidden", "true");
    stage.tabIndex = -1;
    setTimeout(() => revealHero(), reduced ? 0 : 500);
    setTimeout(() => {
      stage.remove();
      try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
      root.style.setProperty("--intro-done", "1");
      document.querySelector('meta[name="theme-color"]').content = "#f7ede4";
    }, reduced ? 1100 : 2300);
  }

  stage.addEventListener("click", start);

  /* ---------- Gästeliste laden ---------- */
  function applyGuest() {
    plural = gast ? (gast.form ? gast.form === "ihr" : (gast.personen || 1) > 1) : true;
    if (gast && has(gast.umschlag)) {
      // nach Bindestrichen nicht umbrechen: „Familie / Müller-Lüdenscheidt“
      inkName.innerHTML = scriptCommas(esc(gast.umschlag.replace(/-/g, "-\u2060")));
      stage.setAttribute("aria-label", `Öffne mich – Umschlag für ${gast.umschlag}`);
      fitName();
      requestAnimationFrame(() => requestAnimationFrame(() => inkName.classList.add("on")));
    }
    // Einladung erst aufbauen, wenn der Browser Luft hat (sie ist während des Intros verborgen)
    (window.requestIdleCallback || (f => setTimeout(f, 1)))(render, { timeout: 1500 });
  }

  fetch("gaeste.json")
    .then(r => r.ok ? r.json() : [])
    .then(list => { gast = code && Array.isArray(list) ? list.find(g => String(g.code).toLowerCase() === code) || null : null; })
    .catch(() => {})
    .finally(() => {
      (document.fonts && document.fonts.load ? Promise.allSettled([document.fonts.load('40px "Eyesome"'), document.fonts.load('40px "Script"')]) : Promise.resolve())
        .catch(() => {}).finally(applyGuest);
    });

  /* ---------- Einladung aufbauen ---------- */
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function sec(id, label, titel, body) {
    return `<div class="divider rv" aria-hidden="true"><span class="mono">K&amp;P</span></div>
    <section class="sec" id="${id}" aria-labelledby="${id}-h"><div class="wrap">
      <p class="label rv">${inline(label)}</p>
      <h2 class="rv" style="--i:1" id="${id}-h">${inline(titel)}</h2>
      ${body}
    </div></section>`;
  }

  let rendered = false;
  function render() {
    rendered = true;
    document.querySelectorAll("[data-t]").forEach(el => {
      const v = el.dataset.t.split(".").reduce((o, k) => o && o[k], D);
      el.innerHTML = inline(v || "");
    });

    const out = [];

    // Begrüßung
    const anrede = gast && has(gast.anrede) ? gast.anrede : D.begruessung.anredeOhneCode;
    out.push(`<section class="sec" id="willkommen" aria-label="Begrüßung"><div class="wrap">
      <p class="greet-name rv">${scriptCommas(inline(anrede) + ",")}</p>
      <div class="lead rv" style="--i:1">${paras(D.begruessung.text)}${gast && gast.kinder ? paras(D.begruessung.kinder) : ""}</div>
      <p class="label signature rv" style="--i:2">${inline(D.begruessung.unterschrift)}</p>
    </div></section>`);

    // Datum + Countdown + Kalender
    const k = D.datum.kalender;
    const gcal = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(k.googleTitel)}&dates=${k.googleDatum}&location=${encodeURIComponent(k.googleOrt)}`;
    out.push(sec("datum", D.datum.label, D.datum.titel, `
      <p class="weekday rv" style="--i:2">${inline(D.datum.wochentag)}</p>
      <div class="rv" style="--i:3" id="countdown" aria-live="off"></div>
      <div class="btns rv" style="--i:4">
        <a class="btn" href="${esc(k.ics)}" download="Hochzeit-Kathrin-Philipp.ics"><span>Zum Kalender hinzufügen</span></a>
        <a class="textlink small" href="${esc(gcal)}" target="_blank" rel="noopener">oder in Google Kalender eintragen</a>
      </div>`));

    // Ablauf
    out.push(sec("ablauf", D.ablauf.label, D.ablauf.titel, `
      <ol class="timeline">${D.ablauf.punkte.map((p, i) => `
        <li class="rv" style="--i:${i % 3}"><span class="t-time">${inline(p.zeit)}</span><span class="t-title">${inline(p.titel)}</span>${has(p.text) ? `<span class="t-text">${inline(tidy(p.text))}</span>` : ""}</li>`).join("")}
      </ol>`));

    // Ort
    const o = D.ort, maps = isIOS ? o.appleMaps : o.googleMaps;
    out.push(sec("ort", o.label, o.name, `
      <address class="rv" style="--i:2"><a href="${esc(maps)}" target="_blank" rel="noopener">${inline(o.strasse)}<br>${inline(o.plzOrt)}${has(o.land) ? `<br>${inline(o.land)}` : ""}</a></address>
      ${has(o.text) ? `<div class="lead rv">${paras(o.text)}</div>` : ""}
      <div class="btns rv" style="--i:3"><a class="btn" href="${esc(maps)}" target="_blank" rel="noopener"><span>Route planen</span></a></div>`));

    // Anreise
    const a = D.anreise;
    out.push(sec("anreise", a.label, a.titel, `<div class="blocks">
      <div class="rv"><h3>Anfahrt</h3>${paras(a.anfahrt)}${has(a.anfahrtLink) ? `<a class="btn" href="${esc(a.anfahrtLink)}" target="_blank" rel="noopener"><span>In Google Maps öffnen</span></a>` : ""}</div>
      <div class="rv"><h3>Parken</h3>${paras(a.parken)}</div>
      <div class="rv"><h3>Unterkünfte</h3>${paras(a.unterkuenfte)}</div></div>`));

    // Dresscode
    out.push(sec("dresscode", D.dresscode.label, D.dresscode.titel, has(D.dresscode.text) ? `<div class="lead rv" style="--i:2">${paras(D.dresscode.text)}</div>` : ""));

    // Zu- oder Absage
    const r = D.rsvp;
    out.push(sec("antwort", r.label, r.titel, `
      <p class="lead rv" style="--i:2">${inline(r.fristText)}<span style="white-space:nowrap">${inline(r.frist)}</span>.</p>
      <div id="rsvp" class="rv" style="--i:3"></div>`));

    // Geschenke
    out.push(sec("geschenke", D.geschenke.label, D.geschenke.titel, `<div class="lead rv" style="--i:2">${paras(D.geschenke.text)}</div>`));

    // Ansprechpartner
    const ap = D.ansprechpartner;
    out.push(sec("ueberraschungen", ap.label, ap.titel, `
      <div class="lead rv" style="--i:2">${paras(ap.text)}</div>
      <div class="people">${ap.personen.map((p, i) => {
        const tel = String(p.telefon || "").replace(/[^\d+]/g, "");
        const wa = tel.replace(/^\+/, "").replace(/^00/, "");
        const links = tel ? `<div class="person-links">
            <a class="btn" href="tel:${esc(tel)}"><span>Anrufen</span></a>
            ${p.whatsapp ? `<a class="btn" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener"><span>WhatsApp</span></a>` : ""}
          </div>` : `<p class="note"><mark class="ph">[Telefonnummer]</mark></p>`;
        return `<div class="rv" style="--i:${i}"><p class="person-name">${inline(p.name)}</p><p class="label person-role">${inline(p.rolle)}</p>${tel ? `<p class="note" style="font-variant-numeric:lining-nums">${esc(p.telefon)}</p>` : ""}${links}</div>`;
      }).join("")}</div>`));

    // FAQ
    out.push(sec("faq", D.faq.label, D.faq.titel, `<div class="faq rv" style="--i:2">${D.faq.fragen.map(f => `
      <details><summary>${inline(f.frage)}</summary><div class="answer"><div>${paras(f.antwort)}</div></div></details>`).join("")}</div>`));

    // Fotos (optional)
    if (D.fotos.bilder.length) {
      out.push(sec("fotos", D.fotos.label, D.fotos.titel, `<div class="photos">${D.fotos.bilder.map((b, i) => `
        <figure class="rv" style="--i:${i % 2}"><img src="${esc(b.src)}" ${b.srcset ? `srcset="${esc(b.srcset)}" sizes="(min-width: 760px) 700px, 100vw"` : ""} width="${b.breite || ""}" height="${b.hoehe || ""}" alt="${esc(b.alt || "")}" loading="lazy" decoding="async">${has(b.text) ? `<figcaption>${inline(b.text)}</figcaption>` : ""}</figure>`).join("")}</div>`));
    }

    $("#sections").innerHTML = out.join("");
    countdown();
    rsvpInit();
    faqInit();
    observe();
  }

  /* ---------- Countdown ---------- */
  let cdTimer = 0;
  function countdown() {
    const el = $("#countdown");
    if (!el) return;
    const ms = new Date(D.datum.countdownBis).getTime() - Date.now();
    if (ms <= 0) {
      el.innerHTML = `<p class="count-done">${ms > -864e5 ? "Heute ist es so weit." : "Danke, dass {du|ihr} dabei {warst|wart}.".replace(/\{([^|]*)\|([^}]*)\}/g, (_, a, b) => plural ? b : a)}</p>`;
      return;
    }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
    const u = (n, s, p) => n === 1 ? s : p;
    el.innerHTML = `<div class="count" role="timer" aria-label="Noch ${d} ${u(d, "Tag", "Tage")}, ${h} ${u(h, "Stunde", "Stunden")} und ${m} ${u(m, "Minute", "Minuten")}">
      <div aria-hidden="true"><span class="num">${d}</span><span class="label unit">${u(d, "Tag", "Tage")}</span></div>
      <div aria-hidden="true"><span class="num">${h}</span><span class="label unit">${u(h, "Stunde", "Stunden")}</span></div>
      <div aria-hidden="true"><span class="num">${m}</span><span class="label unit">${u(m, "Minute", "Minuten")}</span></div></div>`;
    clearTimeout(cdTimer);
    cdTimer = setTimeout(countdown, 60000 - (Date.now() % 60000) + 50);
  }

  /* ---------- Zu- oder Absage ---------- */
  const storeKey = "kp-rsvp-" + (code || "ohne-code");
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(storeKey)); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(storeKey, JSON.stringify(v)); } catch (e) {} }
  };

  function rsvpInit() {
    const prev = store.get();
    if (prev) thanks(prev.antwort, prev.name, false);
    else rsvpForm();
  }

  function rsvpForm(prefill) {
    const r = D.rsvp, box = $("#rsvp");
    const max = gast ? Math.max(1, gast.personen || 1) : Math.max(1, r.maxPersonenOhneCode || 4);
    const name = prefill && prefill.name || (gast ? gast.umschlag : "");
    box.innerHTML = `<form id="rsvp-form" novalidate>
      <div class="field">
        <label for="f-name">Name${plural ? "n" : ""}</label>
        <input id="f-name" name="name" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" required value="${esc(name)}">
      </div>
      <fieldset>
        <legend class="legend">${inline("{Deine|Eure} Antwort")}</legend>
        <div class="choice">
          <div><input type="radio" id="f-ja" name="antwort" value="Zusage"><label for="f-ja"><span class="dot" aria-hidden="true"></span>${inline(r.zusage)}</label></div>
          <div><input type="radio" id="f-nein" name="antwort" value="Absage"><label for="f-nein"><span class="dot" aria-hidden="true"></span>${inline(r.absage)}</label></div>
        </div>
      </fieldset>
      <div class="field persons" id="f-persons" hidden>
        <span class="legend" id="f-p-label">Anzahl Personen</span>
        ${max > 1 ? `<div class="stepper" role="group" aria-labelledby="f-p-label">
          <button type="button" class="minus" aria-label="Eine Person weniger"></button>
          <output id="f-p" aria-live="polite">${max}</output>
          <button type="button" class="plus" aria-label="Eine Person mehr"></button>
        </div>
        <p class="note">${gast ? `Eingeladen: ${max} Personen` : `Bis zu ${max} Personen`}</p>` : `<p class="note" style="margin-top:0">1 Person</p><output id="f-p" hidden>1</output>`}
      </div>
      <div class="field" id="f-food-wrap">
        <label for="f-essen">Essenswünsche &amp; Unverträglichkeiten</label>
        <input id="f-essen" name="essen" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" placeholder="z. B. vegetarisch, glutenfrei">
      </div>
      <div class="field">
        <label for="f-msg">Nachricht an uns</label>
        <textarea id="f-msg" name="nachricht" rows="3" autocapitalize="sentences" placeholder="optional"></textarea>
      </div>
      <p class="err" id="f-err" role="alert"></p>
      <div class="form-actions"><button class="btn btn-solid" type="submit" id="f-send"><span>Antwort senden</span></button></div>
    </form>`;

    const f = $("#rsvp-form"), persons = $("#f-persons"), out = $("#f-p"), food = $("#f-food-wrap");
    let n = Math.min(max, prefill && prefill.personen || max);
    const upd = () => {
      out.textContent = n;
      const mi = f.querySelector(".minus"), pl = f.querySelector(".plus");
      if (mi) { mi.disabled = n <= 1; pl.disabled = n >= max; }
    };
    upd();
    f.addEventListener("click", e => {
      const b = e.target.closest(".stepper button");
      if (!b) return;
      n = Math.max(1, Math.min(max, n + (b.classList.contains("plus") ? 1 : -1)));
      upd();
    });
    f.addEventListener("change", e => {
      if (e.target.name !== "antwort") return;
      const yes = e.target.value === "Zusage";
      persons.hidden = !yes;
      food.hidden = !yes;
      $("#f-err").textContent = "";
    });
    $("#f-name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#f-ja").focus(); } });
    $("#f-essen").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#f-msg").focus(); } });

    f.addEventListener("submit", e => {
      e.preventDefault();
      const err = $("#f-err");
      const name = $("#f-name").value.trim();
      const choice = f.querySelector("input[name=antwort]:checked");
      if (!name) { err.textContent = "Bitte " + form("{trag deinen Namen|tragt eure Namen}") + " ein."; $("#f-name").focus(); return; }
      if (!choice) { err.textContent = "Bitte " + form("{wähle|wählt}") + " Zu- oder Absage."; $("#f-ja").focus(); return; }
      const data = {
        code: code || "-", name, antwort: choice.value,
        personen: choice.value === "Zusage" ? n : 0,
        essen: choice.value === "Zusage" ? $("#f-essen").value.trim() : "",
        nachricht: $("#f-msg").value.trim()
      };
      const btn = $("#f-send");
      btn.setAttribute("aria-busy", "true");
      send(data).then(ok => {
        store.set({ antwort: data.antwort, name: data.name, personen: data.personen, verbunden: ok });
        thanks(data.antwort, data.name, true, ok);
      }).catch(() => {
        btn.removeAttribute("aria-busy");
        err.textContent = "Das hat leider nicht geklappt. Bitte " + form("{prüfe deine|prüft eure}") + " Internetverbindung und " + form("{versuche|versucht}") + " es noch einmal.";
      });
    });

    keyboardFix(f);
  }

  // Antwort im Hintergrund an das Google-Formular senden
  function send(data) {
    const g = D.rsvp.googleForm;
    if (!g.action) { console.warn("RSVP: Google-Formular noch nicht verbunden", data); return new Promise(r => setTimeout(() => r(false), 600)); }
    const body = new URLSearchParams();
    for (const k in g.felder) if (g.felder[k]) body.append(g.felder[k], data[k]);
    return fetch(g.action, { method: "POST", mode: "no-cors", body }).then(() => true);
  }

  function thanks(antwort, name, animate, verbunden) {
    const r = D.rsvp, box = $("#rsvp");
    const notConnected = verbunden === false && !D.rsvp.googleForm.action;
    box.innerHTML = `<div class="thanks ${animate ? "fade-swap" : ""}" tabindex="-1" id="thanks">
      <div class="mono-ring" aria-hidden="true">K&amp;P</div>
      <p class="script">Danke</p>
      <p>${inline(antwort === "Zusage" ? r.dankeZusage : r.dankeAbsage)}</p>
      ${notConnected ? `<p class="note"><mark class="ph">[Testmodus: Formular noch nicht verbunden – Antwort wurde nicht gespeichert]</mark></p>` : ""}
      <p><button type="button" class="textlink small" id="f-again" style="background:none;border:0">Antwort ändern</button></p>
    </div>`;
    $("#f-again").addEventListener("click", () => {
      const prev = store.get();
      rsvpForm(prev);
      $("#rsvp").classList.add("in");
      $("#f-name").focus({ preventScroll: true });
      $("#antwort").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
    });
    if (animate) { const t = $("#thanks"); t.focus({ preventScroll: true }); $("#antwort").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" }); }
  }

  // Eingeblendete Tastatur: Feld bzw. Button sichtbar halten
  function keyboardFix(f) {
    const vv = window.visualViewport;
    const keep = () => {
      const el = document.activeElement;
      if (!el || !f.contains(el) || !vv) return;
      const r = el.getBoundingClientRect();
      if (r.bottom > vv.height - 24 || r.top < 24) el.scrollIntoView({ block: "center", behavior: "smooth" });
    };
    f.addEventListener("focusin", () => setTimeout(keep, 350));
    if (vv) vv.addEventListener("resize", keep);
  }

  /* ---------- FAQ: weiches Auf- und Zuklappen ---------- */
  function faqInit() {
    document.querySelectorAll(".faq details").forEach(d => {
      const s = d.querySelector("summary"), a = d.querySelector(".answer");
      s.addEventListener("click", e => {
        if (reduced || !a.animate) return;
        e.preventDefault();
        if (d.open) {
          const h = a.offsetHeight;
          a.animate([{ height: h + "px", opacity: 1 }, { height: "0px", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.22,1,.36,1)" })
            .onfinish = () => { d.open = false; };
        } else {
          d.open = true;
          const h = a.offsetHeight;
          a.animate([{ height: "0px", opacity: 0 }, { height: h + "px", opacity: 1 }], { duration: 900, easing: "cubic-bezier(.22,1,.36,1)" });
        }
      });
    });
  }

  /* ---------- Einblenden beim Scrollen ---------- */
  let io;
  function observe() {
    const els = document.querySelectorAll("#sections .rv:not(.in), footer .rv:not(.in)");
    if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
    io = io || new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px", threshold: 0.01 });
    els.forEach(e => io.observe(e));
  }
  function revealHero() { document.querySelectorAll(".hero .rv").forEach(e => e.classList.add("in")); }

  /* ---------- Musik ---------- */
  if (has(D.musik)) {
    const btn = $("#music"), audio = $("#audio");
    let on = false, resume = false;
    btn.hidden = false;
    const set = v => {
      on = v;
      btn.setAttribute("aria-pressed", String(v));
      btn.setAttribute("aria-label", v ? "Musik pausieren" : "Musik abspielen");
    };
    btn.addEventListener("click", () => {
      if (!audio.src) audio.src = D.musik;
      if (on) { audio.pause(); set(false); }
      else { audio.volume = 0.6; audio.play().then(() => set(true)).catch(() => set(false)); }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { resume = on; if (on) { audio.pause(); set(false); } }
      else if (resume) { audio.play().then(() => set(true)).catch(() => {}); resume = false; }
    });
    window.addEventListener("pagehide", () => audio.pause());
  }

})();
</script>
</body>
</html>
